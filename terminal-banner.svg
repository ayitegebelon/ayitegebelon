<svg width="760" height="230" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080D"/>
      <stop offset="55%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#0B1F1A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="760" height="230" rx="14" fill="url(#bg)" stroke="#1C2530" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="0" y="0" width="760" height="34" rx="14" fill="#0D1420"/>
  <rect x="0" y="20" width="760" height="14" fill="#0D1420"/>
  <circle cx="22" cy="17" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="17" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="17" r="6" fill="#28C840"/>
  <text x="380" y="21" fill="#5B6675" font-size="12" text-anchor="middle">ayitegeb@bale-robe: ~/systems</text>

  <!-- typed lines -->
  <g font-size="15">
    <text x="26" y="66" fill="#58A6FF" opacity="0">
      <tspan fill="#3FB950">$</tspan> whoami
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="26" y="94" fill="#E6EDF3" opacity="0">&gt; ayitegeb_tilahun — full-stack &amp; AI systems engineer
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="26" y="130" fill="#58A6FF" opacity="0">
      <tspan fill="#3FB950">$</tspan> cat philosophy.txt
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="26" y="158" fill="#8B949E" opacity="0">&gt; understand the problem · design the system · build something useful
      <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="26" y="194" fill="#58A6FF" opacity="0" filter="url(#glow)">
      <tspan fill="#3FB950">$</tspan> ./run --from="Bale Robe, Ethiopia" --scope="the world"
      <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.5s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="30" y="182" width="9" height="16" fill="#58A6FF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.01s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
  </rect>
</svg>
